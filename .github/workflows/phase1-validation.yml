name: Phase 1 validation

on:
  push:
    branches:
      - phase-1-critical-fixes
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend JavaScript syntax
        run: node --check server.js

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
          NEXT_PUBLIC_WS_URL: wss://example.invalid/ws
          NEXT_PUBLIC_LOCAL_BRIDGE_URL: http://127.0.0.1:8765

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m compileall -q main.py web_server.py
